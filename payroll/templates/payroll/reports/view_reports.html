{% extends 'index.html' %}
{% block content %}
{% load i18n %}
{% load static %}

<section class="oh-wrapper oh-main__topbar">
    <div class="oh-main__titlebar oh-main__titlebar--left">
        <h1 class="oh-main__titlebar-title fw-bold">{% trans "Reports" %}</h1>
    </div>
    <div class="oh-main__titlebar oh-main__titlebar--right">
        <div class="oh-main__titlebar-button-container">
            {% if perms.payroll.add_payslip %}
                <div class="oh-btn-group ml-2">
                    <a class="oh-btn oh-btn--secondary oh-btn--shadow"
                        data-toggle="oh-modal-toggle" data-target="#genericModal"
                        hx-get="{% url 'create-payroll-report' %}" hx-target="#genericModalBody">
                        <ion-icon class="md hydrated" name="add-outline" role="img"
                            aria-label="add outline"></ion-icon>{% trans "Create" %}
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</section>

<div class="oh-wrapper">
    <div id="payroll-reports-container">
        {% include 'payroll/reports/list_reports.html' %}
    </div>
</div>
{% endblock content %}
