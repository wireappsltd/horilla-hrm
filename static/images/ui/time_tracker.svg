<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor">
  <!-- Clock face -->
  <circle cx="256" cy="272" r="192" fill="none" stroke="currentColor" stroke-width="32"/>
  <!-- Hour hand -->
  <line x1="256" y1="272" x2="256" y2="160" stroke="currentColor" stroke-width="28" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="272" x2="328" y2="272" stroke="currentColor" stroke-width="28" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="272" r="16"/>
  <!-- Crown / winder -->
  <rect x="220" y="64" width="72" height="28" rx="8"/>
</svg>
