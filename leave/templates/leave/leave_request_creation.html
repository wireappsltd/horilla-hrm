{% extends 'index.html' %}{% load i18n %}{% block content %}
<p class="pb-3">
  <a href="/leave/request-view" class="btn btn-danger">{% trans "View" %}</a> {% trans "All Leave Requests" %}
</p>
<div class="container ml-5 mr-5 pl-5 pr-5">
<form action="" method="post" enctype="multipart/form-data">
  {%csrf_token%} {{form.as_p}}
  <input type="submit" class="btn btn-danger"/>
</form>
</div>
<script>
  // Prevent selecting an End Date earlier than the selected Start Date by

  (function () {
    var startInput = document.querySelector("#id_start_date, input[name='start_date']");
    var endInput = document.querySelector("#id_end_date, input[name='end_date']");
    if (!startInput || !endInput) return;
    var defaultMin = endInput.min || "";

    function syncEndDateMin() {
      if (startInput.value) {
        endInput.min = startInput.value;
        if (endInput.value && endInput.value < startInput.value) {
          endInput.value = "";
        }
      } else {
        endInput.min = defaultMin;
      }
    }

    startInput.addEventListener("change", syncEndDateMin);
    startInput.addEventListener("input", syncEndDateMin);
    syncEndDateMin();
  })();
</script>
{% endblock %}
