{% load i18n %}{% load horillafilters %} {% if messages %}
<div class="oh-wrapper">
    {% for message in messages %}
    <div class="oh-alert-container">
        <div class="oh-alert oh-alert--animated {{message.tags}}">
            {{ message }}
        </div>
    </div>
    {% endfor %}
    <script>
        $('.filterButton')[0].click();
        setTimeout(function () {
            $(".oh-modal__close").click();
        }, 1000);
    </script>
</div>
{% endif %}
<div class="oh-modal__dialog-header">
    <span class="oh-modal__dialog-title" id="requestCreateModalLabel"
        >{{form.verbose_name}}</span
    >
    <button
        class="oh-modal__close"
        aria-label="Close"
    >
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>
<form
    hx-post="{% url 'user-request' id %}?{{pd}}"
    hx-target="#objectCreateModalTarget"
    hx-encoding="multipart/form-data"
    id="userLeaveForm"
>
    <div class="oh-modal__dialog-body">{{form.as_p}}</div>
</form>

<script>
    // Preserve the leave-request attachment across validation-failure re-renders.
    // HTMX replaces the form HTML on error, wiping the native file input. We cache
    // the selected File in memory and re-apply it to the new input via DataTransfer.
    // Matches any form containing #id_attachment so it covers Apply Leave, My Leave
    // Request, and the admin Leave Request modals.
    if (!window.__leaveRequestAttachmentHandlerBound) {
        window.__leaveRequestAttachmentHandlerBound = true;

        document.body.addEventListener("htmx:beforeRequest", function (event) {
            const el = event.target;
            if (!el || !el.closest) return;
            const form = el.tagName === "FORM" ? el : el.closest("form");
            if (!form) return;
            const input = form.querySelector("#id_attachment")
                || form.querySelector('input[type="file"][name="attachment"]');
            if (input && input.files && input.files.length > 0) {
                window.__leaveRequestAttachmentFile = input.files[0];
            }
        });

        document.body.addEventListener("htmx:afterSwap", function (event) {
            const target = event.target;
            if (!target || !target.querySelector) return;
            const newInput = target.querySelector("#id_attachment")
                || target.querySelector('input[type="file"][name="attachment"]');
            if (!newInput) return;

            // Only restore when the swap is a validation-failure re-render. If
            // there are no field errors, treat it as a fresh form and drop the
            // cached file to avoid leaking it into a later session.
            const hasErrors = target.querySelector(".errorlist, .text-danger") !== null;
            const cachedFile = window.__leaveRequestAttachmentFile;
            if (!hasErrors || !cachedFile) {
                window.__leaveRequestAttachmentFile = null;
                return;
            }
            if (newInput.files && newInput.files.length > 0) return;

            try {
                const dt = new DataTransfer();
                dt.items.add(cachedFile);
                newInput.files = dt.files;
                newInput.dispatchEvent(new Event("change", { bubbles: true }));
            } catch (err) {
                // DataTransfer unsupported on this browser; user will need to re-upload.
            }
        });

        // Clear the cache when the modal is dismissed so a later open starts clean.
        document.body.addEventListener("click", function (event) {
            if (event.target.closest && event.target.closest(".oh-modal__close")) {
                window.__leaveRequestAttachmentFile = null;
            }
        });
    }
</script>

{% if "recruitment"|app_installed %}
    <script>
        $("#userLeaveForm [type=submit]").hide();
        var button = `
        <div class="oh-modal__dialog-footer p-0 mt-3">
        <button id="buttonID" class="oh-btn oh-btn--secondary oh-btn--shadow">
            Save
        </button>
        </div>
        `;
        $("#userLeaveForm .row").after(button);

        $(document).ready(function () {
            $("#buttonID").on("click", function () {
                event.preventDefault();
                event.stopPropagation();
                var startDate = $("#userLeaveForm [name = start_date]").val();
                var endDate = $("#userLeaveForm [name = end_date]").val();
                var employee = "{{request.user.employee_get.id}}";

                $.ajax({
                    type: "GET",
                    url: "{% url 'check-interview-conflicts' %}",
                    data: {
                        start_date: startDate,
                        end_date: endDate,
                        employee_id: employee,
                    },
                    success: function (response) {
                        var interviews = response.interviews;

                        title = "Leave Request Alert.";
                        var content = `<div>
                <p>{{request.user.employee_get}} has interview in the requested date.</p>
                <ol style="margin-left:5%">`;
                        interviews.forEach(function (interview, index) {
                            content += `<li style="text-align:left; font-size:14px">${interview}</li>`;
                        });
                        content += `</ol>
                <p style="font-weight:700">Are you sure you want to proceed with the request?</p>
            </div>`;

                        if (interviews.length != 0) {
                            Swal.fire({
                                title: title,
                                icon: "info",
                                html: content,
                                showCancelButton: true,
                                confirmButtonColor: "#008000",
                                cancelButtonColor: "#d33",
                                confirmButtonText: "Confirm",
                            }).then(function (result) {
                                if (result.isConfirmed) {
                                    $("#userLeaveForm [type=submit]").show();
                                    $("#buttonID").hide();
                                    $("#userLeaveForm [type=submit]").click();
                                }
                            });
                        } else {
                            $("#userLeaveForm [type=submit]").click();
                        }
                    },
                });
            });
        });
    </script>
{% endif %}
