{% load i18n %} {% load horillafilters %}

        hx-on-htmx-after-request="setTimeout(function () { reloadMessage(this); $('.oh-modal__close').click(); }, 1000);">
    </span>
{% endif %}
<script>
    $("#objectUpdateModalTarget").empty();
</script>
<div class="oh-modal__dialog-header">
    <span class="oh-modal__dialog-title" id="objectCreateModalLabel">{{form.verbose_name}}</span>
    <button class="oh-modal__close" aria-label="Close">
        <ion-icon name="close-outline"></ion-icon>
    </button>
    <div id="availableLeaveCount" style="height: 40px;display: none;"></div>
</div>
<div class="oh-modal__dialog-body">
    <form hx-post="{% url 'request-creation' %}?{{pd}}" hx-encoding="multipart/form-data"
        hx-target="#objectCreateModalTarget" id="leaveRequestCreateForm">
        {{form.as_p}}
    </form>
</div>

<script>
    // Prevent the admin from selecting the same employee as the Covering
    // Person. The manager dropdown is rendered once with the full active
    // employee list; whenever the Employee selection changes we remove the
    // matching <option> (caching it so we can restore it later) and clear
    // the manager value if it was the same person. This mirrors the
    // server-side validation in `_validate_covering_person_not_self`.
    (function () {
        const form = document.getElementById("leaveRequestCreateForm");
        if (!form) return;
        const employeeSelect = form.querySelector('[name="employee_id"]');
        const managerSelect = form.querySelector('[name="manager"]');
        if (!employeeSelect || !managerSelect) return;

        // Cache of options that we've removed, keyed by their value, so we
        // can restore them when the employee selection changes again.
        const removedOptions = {};

        function syncCoveringPersonOptions() {
            const selectedEmpId = String(employeeSelect.value || "");

            // Restore any previously removed options that no longer match
            // the currently selected employee.
            Object.keys(removedOptions).forEach(function (val) {
                if (val !== selectedEmpId) {
                    const cached = removedOptions[val];
                    if (cached && !managerSelect.querySelector(
                            'option[value="' + window.CSS.escape(val) + '"]')) {
                        // Re-insert at original index when possible.
                        const refNode = managerSelect.options[cached.index] || null;
                        managerSelect.insertBefore(cached.node, refNode);
                    }
                    delete removedOptions[val];
                }
            });

            // Remove the option matching the selected employee, if present.
            if (selectedEmpId) {
                const match = Array.prototype.find.call(
                    managerSelect.options,
                    function (opt) { return String(opt.value) === selectedEmpId; }
                );
                if (match) {
                    removedOptions[selectedEmpId] = {
                        node: match,
                        index: match.index,
                    };
                    if (match.selected) {
                        managerSelect.value = "";
                    }
                    match.parentNode.removeChild(match);
                }
            }

            if (window.jQuery) {
                try { window.jQuery(managerSelect).trigger("change.select2"); } catch (e) { }
            }
        }

        employeeSelect.addEventListener("change", syncCoveringPersonOptions);
        // Run once on initial load so a pre-filled employee is already excluded.
        syncCoveringPersonOptions();
    })();
</script>

<script>
    // Constrain the attachment input's click target to the native control.
    // The shared horilla_form.html applies form-control/w-100 to every field,
    // which stretches the file input across the row — browsers then treat the
    // whole stretched box as the file-picker trigger. Strip those classes and
    // apply an inline style so clicking row whitespace no longer opens the
    // file dialog.
    (function () {
        const form = document.getElementById("leaveRequestCreateForm");
        if (!form) return;
        const input = form.querySelector("#id_attachment")
            || form.querySelector('input[type="file"][name="attachment"]');
        if (!input) return;
        input.classList.remove("form-control", "w-100");
        input.style.display = "inline-block";
        input.style.width = "auto";
        input.style.maxWidth = "100%";
        input.style.padding = "0.4rem 0.6rem";
        input.style.border = "1px solid hsl(213, 22%, 84%)";
        input.style.backgroundColor = "#fff";
    })();
</script>

<script>
    // Preserve the leave-request attachment across validation-failure re-renders.
    // HTMX replaces the form HTML on error, wiping the native file input. We cache
    // the selected File in memory and re-apply it to the new input via DataTransfer.
    // Matches any form containing #id_attachment so it covers Apply Leave, My Leave
    // Request, and the admin Leave Request modals.
    if (!window.__leaveRequestAttachmentHandlerBound) {
        window.__leaveRequestAttachmentHandlerBound = true;

        document.body.addEventListener("htmx:beforeRequest", function (event) {
            const el = event.target;
            if (!el || !el.closest) return;
            const form = el.tagName === "FORM" ? el : el.closest("form");
            if (!form) return;
            const input = form.querySelector("#id_attachment")
                || form.querySelector('input[type="file"][name="attachment"]');
            if (input && input.files && input.files.length > 0) {
                window.__leaveRequestAttachmentFile = input.files[0];
            }
        });

        document.body.addEventListener("htmx:afterSwap", function (event) {
            const target = event.target;
            if (!target || !target.querySelector) return;
            const newInput = target.querySelector("#id_attachment")
                || target.querySelector('input[type="file"][name="attachment"]');
            if (!newInput) return;

            // Only restore when the swap is a validation-failure re-render. If
            // there are no field errors, treat it as a fresh form and drop the
            // cached file to avoid leaking it into a later session.
            const hasErrors = target.querySelector(".errorlist, .text-danger") !== null;
            const cachedFile = window.__leaveRequestAttachmentFile;
            if (!hasErrors || !cachedFile) {
                window.__leaveRequestAttachmentFile = null;
                return;
            }
            if (newInput.files && newInput.files.length > 0) return;

            try {
                const dt = new DataTransfer();
                dt.items.add(cachedFile);
                newInput.files = dt.files;
                newInput.dispatchEvent(new Event("change", { bubbles: true }));
            } catch (err) {
                // DataTransfer unsupported on this browser; user will need to re-upload.
            }
        });

        // Clear the cache when the modal is dismissed so a later open starts clean.
        document.body.addEventListener("click", function (event) {
            if (event.target.closest && event.target.closest(".oh-modal__close")) {
                window.__leaveRequestAttachmentFile = null;
            }
        });
    }
</script>

<script>

    if (!window.__leaveRequestDateRangeHandlerBound) {
        window.__leaveRequestDateRangeHandlerBound = true;

        function syncLeaveEndDateMin(startInput) {
            if (!startInput || !startInput.form) return;
            var endInput = startInput.form.querySelector("#id_end_date")
                || startInput.form.querySelector('input[name="end_date"]');
            if (!endInput) return;

            var startValue = startInput.value;
            if (startValue) {
                endInput.min = startValue;
                if (endInput.value && endInput.value < startValue) {
                    endInput.value = "";
                    endInput.dispatchEvent(new Event("change", { bubbles: true }));
                }
            } else {
                // Fall back to the server-provided minimum (e.g. today) when set.
                endInput.min = endInput.getAttribute("data-default-min") || "";
            }
        }

        function isLeaveStartDateInput(el) {
            if (!el || el.tagName !== "INPUT") return false;
            return el.id === "id_start_date" || el.name === "start_date";
        }

        document.body.addEventListener("change", function (event) {
            if (isLeaveStartDateInput(event.target)) {
                syncLeaveEndDateMin(event.target);
            }
        });
        document.body.addEventListener("input", function (event) {
            if (isLeaveStartDateInput(event.target)) {
                syncLeaveEndDateMin(event.target);
            }
        });

        // Initialise on load and after every HTMX swap that brings in the form.
        function initLeaveDateRange(root) {
            var scope = root && root.querySelectorAll ? root : document;
            scope.querySelectorAll("#id_start_date, input[name='start_date']").forEach(function (startInput) {
                var endInput = startInput.form
                    && (startInput.form.querySelector("#id_end_date")
                        || startInput.form.querySelector('input[name="end_date"]'));
                if (endInput && endInput.min) {
                    endInput.setAttribute("data-default-min", endInput.min);
                }
                syncLeaveEndDateMin(startInput);
            });
        }

        document.body.addEventListener("htmx:afterSwap", function (event) {
            initLeaveDateRange(event.target);
        });
    }

    // Run once for the current render (covers this modal and non-HTMX pages).
    (function () {
        document.querySelectorAll("#id_start_date, input[name='start_date']").forEach(function (startInput) {
            var endInput = startInput.form
                && (startInput.form.querySelector("#id_end_date")
                    || startInput.form.querySelector('input[name="end_date"]'));
            if (endInput && endInput.min) {
                endInput.setAttribute("data-default-min", endInput.min);
            }
            if (startInput.value && endInput) {
                endInput.min = startInput.value;
            }
        });
    })();
</script>

{% if "recruitment"|app_installed %}
<script>
    $("#leaveRequestCreateForm [type=submit]").hide();
    var button = `
                <div class="oh-modal__dialog-footer p-0 mt-3">
                <button id="buttonID" class="oh-btn oh-btn--secondary oh-btn--shadow">
                    Save
                </button>
                </div>
                `;
    $("#leaveRequestCreateForm .row").after(button);

    $(document).ready(function () {
        $("#buttonID").on("click", function () {
            event.preventDefault();
            event.stopPropagation();
            var startDate = $("#leaveRequestCreateForm [name = start_date]").val();
            var endDate = $("#leaveRequestCreateForm [name = end_date]").val();
            var employee = $("#leaveRequestCreateForm [name = employee_id]").val();

            $.ajax({
                type: "GET",
                url: "{% url 'check-interview-conflicts' %}",
                data: {
                    start_date: startDate,
                    end_date: endDate,
                    employee_id: employee,
                },
                success: function (response) {
                    var interviews = response.interviews;

                    title = "Leave Request Alert.";
                    var content = `<div>
                                                <p>${employee} has interview in the requested date.</p>
                                                <ol style="margin-left:5%">`;
                    interviews.forEach(function (interview, index) {
                        content += `<li style="text-align:left; font-size:14px">${interview}</li>`;
                    });
                    content += `</ol>
                                                <p style="font-weight:700">Are you sure you want to proceed with the request?</p>
                                            </div>`;

                    if (interviews.length != 0) {
                        Swal.fire({
                            title: title,
                            icon: "info",
                            html: content,
                            showCancelButton: true,
                            confirmButtonColor: "#008000",
                            cancelButtonColor: "#d33",
                            confirmButtonText: "Confirm",
                        }).then(function (result) {
                            if (result.isConfirmed) {
                                $("#leaveRequestCreateForm [type=submit]").click();
                            }
                        });
                    } else {
                        $("#leaveRequestCreateForm [type=submit]").click();
                    }
                },
            });
        });
    });
</script>
{% endif %}
