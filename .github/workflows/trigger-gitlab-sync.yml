name: GitLab Sync

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set GitLab repo name and default branch
        run: |
          echo "REPO_NAME=horilla-hrm" >> $GITHUB_ENV
          echo "DEFAULT_BRANCH=development" >> $GITHUB_ENV


      - name: Create GitLab repo if not exists
        env:
          GITLAB_TOKEN: ${{ secrets.TARGET_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.TARGET_USERNAME }}
          REPO_NAME: ${{ env.REPO_NAME }}
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}

        run: |

          echo "Checking GitLab repo '$REPO_NAME'..."

          PROJECT_URL_ENCODED=$(echo -n "$GITLAB_USERNAME/$REPO_NAME" | jq -s -R -r @uri)


          RAW_RESPONSE=$(curl -s \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/${PROJECT_URL_ENCODED}")


          EXISTS=$(echo "$RAW_RESPONSE" | jq -r '.id // empty')


          if [ -n "$EXISTS" ]; then

            echo "✅ Repo already exists."

          else

            echo "🚀 Creating GitLab repo..."


            CREATE_RESPONSE=$(curl -s \
              --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"$REPO_NAME\",\"path\":\"$REPO_NAME\"}" \
              https://gitlab.com/api/v4/projects)


            if echo "$CREATE_RESPONSE" | jq -e '.id' > /dev/null 2>&1; then

              echo "✅ Repo created successfully"

            else

              echo "❌ Failed creating repo"
              echo "$CREATE_RESPONSE"
              exit 1

            fi

          fi



          echo "Setting GitLab default branch: $DEFAULT_BRANCH"


          PROJECT_ID=$(curl -s \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/${PROJECT_URL_ENCODED}" \
            | jq -r '.id')


          curl -s \
            --request PUT \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"default_branch\":\"$DEFAULT_BRANCH\"}" \
            "https://gitlab.com/api/v4/projects/$PROJECT_ID"



      - name: Fetch and checkout default branch
        run: |

          echo "Fetching $DEFAULT_BRANCH..."

          git fetch origin $DEFAULT_BRANCH

          git checkout $DEFAULT_BRANCH



      - name: Add GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.TARGET_TOKEN }}
          REPO_NAME: ${{ env.REPO_NAME }}

        run: |

          git remote remove gitlab 2>/dev/null || true

          git remote add gitlab \
          https://oauth2:${GITLAB_TOKEN}@gitlab.com/${{ secrets.TARGET_USERNAME }}/${REPO_NAME}.git



      - name: Push branch to GitLab
        run: |

          echo "🚀 Syncing $DEFAULT_BRANCH to GitLab..."

          git push gitlab $DEFAULT_BRANCH --force

          echo "✅ Sync completed"
