{% comment %}Shared design tokens for the Time Tracker settings pages (gear-icon → General Settings).{% endcomment %}
<style>
  .tt-set { padding-bottom: 1.5rem; }
  .tt-header { display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: .75rem; margin-bottom: 1rem; }
  .tt-header__title { font-size: 1.4rem; font-weight: 700; color: #111827; margin: 0; }
  .tt-header__sub { color: #6b7280; font-size: .86rem; margin: .15rem 0 0; }

  .tt-btn { display: inline-flex; align-items: center; gap: .35rem; border-radius: 10px;
    padding: .5rem 1rem; font-size: .84rem; font-weight: 600; cursor: pointer;
    text-decoration: none; border: 1px solid transparent; transition: background .15s; }
  .tt-btn--primary { background: #4f46e5; color: #fff; }
  .tt-btn--primary:hover { background: #4338ca; color: #fff; }
  .tt-btn--ghost { background: #fff; border-color: #e8ebf0; color: #4b5563; }
  .tt-btn--ghost:hover { background: #f5f6f8; color: #111827; }

  /* segmented tab nav */
  .tt-tabs { display: inline-flex; gap: .25rem; background: #f1f2f5; border-radius: 12px;
    padding: .3rem; margin-bottom: 1.25rem; }
  .tt-tab { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .95rem;
    border-radius: 9px; font-size: .85rem; font-weight: 600; color: #6b7280;
    text-decoration: none; transition: all .12s; }
  .tt-tab ion-icon { font-size: 1.05rem; }
  .tt-tab:hover { color: #111827; }
  .tt-tab--active { background: #fff; color: #4f46e5; box-shadow: 0 1px 2px rgba(16,24,40,.08); }

  .tt-card { background: #fff; border: 1px solid #e8ebf0; border-radius: 14px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04); overflow: hidden; }
  .tt-card--narrow { max-width: 680px; }
  .tt-card__head { padding: 1.1rem 1.35rem; border-bottom: 1px solid #f0f1f4; }
  .tt-card__title { font-size: 1rem; font-weight: 700; color: #111827; margin: 0; }
  .tt-card__sub { color: #8a93a3; font-size: .82rem; margin: .2rem 0 0; }
  .tt-card__foot { padding: 1.1rem 1.35rem; border-top: 1px solid #f0f1f4; }

  /* toggle setting rows */
  .tt-setting { display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: 1rem 1.35rem; border-bottom: 1px solid #f4f5f7; }
  .tt-setting:last-child { border-bottom: none; }
  .tt-setting:hover { background: #fbfbfd; }
  .tt-setting__label { font-weight: 600; color: #1f2937; font-size: .92rem; margin: 0; }
  .tt-setting__desc { color: #8a93a3; font-size: .8rem; margin: .15rem 0 0; }

  /* tables */
  .tt-table { width: 100%; border-collapse: collapse; }
  .tt-table thead th { text-align: left; font-size: .72rem; font-weight: 700; color: #9aa1ad;
    text-transform: uppercase; letter-spacing: .05em; padding: .75rem 1.35rem; background: #fafbfc;
    border-bottom: 1px solid #f0f1f4; }
  .tt-table .ta-r { text-align: right; }
  .tt-table tbody td { padding: .75rem 1.35rem; border-bottom: 1px solid #f4f5f7;
    vertical-align: middle; font-size: .88rem; color: #374151; }
  .tt-table tbody tr:last-child td { border-bottom: none; }
  .tt-table tbody tr { transition: background .1s; }
  .tt-table tbody tr:hover { background: #fbfbfd; }

  .tt-name { display: flex; align-items: center; gap: .6rem; font-weight: 600; color: #1f2937; }
  .tt-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .tt-swatch { width: 26px; height: 26px; border-radius: 7px; border: 1px solid #e8ebf0; display: inline-block; }
  .tt-tag-pill { display: inline-flex; align-items: center; font-size: .78rem; font-weight: 600;
    color: #fff; padding: .25rem .7rem; border-radius: 20px; }
  .tt-muted { color: #b6bdc7; }
  .tt-rate { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 600; color: #1f2937; }

  .tt-icon-btn { background: transparent; border: none; cursor: pointer; color: #c2c8d0;
    width: 32px; height: 32px; border-radius: 8px; font-size: 1.1rem;
    display: inline-flex; align-items: center; justify-content: center; transition: all .12s; }
  .tt-icon-btn:hover { background: #eef2ff; color: #4f46e5; }
  .tt-icon-btn--danger:hover { background: #fef2f2; color: #ef4444; }

  .tt-empty { padding: 3rem 1rem; text-align: center; }
  .tt-empty__icon { font-size: 3rem; color: #d1d5db; }
  .tt-empty__text { color: #9ca3af; margin: .6rem 0 1rem; font-size: .92rem; }
</style>
